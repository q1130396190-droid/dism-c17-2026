; ============================================================
; Win8Metro (Dism++) crash dump 配置
; 位置：%AppData%\DismPP\Config\crashdump.ini
; ============================================================

[Dump]
; 是否生成崩溃转储（默认开启）
Enabled=1
; 保留最近 N 份 dump（默认 10，最大 100）
MaxKeep=10
; Dump 类型：0=Normal（默认 ~5MB）/ 1=扩展（+ThreadInfo+UnloadedModules）
DumpType=0

; ============================================================
; [Upload] 段（B3）
; 默认关闭。开启后崩溃时会通过 HTTP/HTTPS 把 .dmp 文件
; POST 到 Url 指定的地址（X-API-Key header 可选，用于认证）。
; ============================================================
[Upload]
; 是否启用上传（0=禁用 / 1=启用，默认 0）
Enable=0
; 上传目标 URL（http:// 或 https:// 前缀）
Url=
; API Key（可选，作为 X-API-Key header 发送）
ApiKey=
; 超时毫秒（默认 10000，最大 60000）
TimeoutMs=10000

; ------------------------------------------------------------
; 上传行为说明：
;   - 上传在 detached 线程里进行，不阻塞崩溃退出
;   - 失败静默，不影响 UI
;   - dump 文件 >16MB 时放弃上传
;   - 上传成功后会在 .dmp 旁写 .dmp.sent 标记
;   - 上传失败时保留原 .dmp 供人工处理
; ------------------------------------------------------------
